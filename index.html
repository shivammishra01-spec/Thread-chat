<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Thread — Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/8.9.1/firebase-app.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/8.9.1/firebase-auth.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/8.9.1/firebase-firestore.min.js"></script>
<style>
  :root{
    --bg: #12141b;
    --panel: #1a1d27;
    --panel-2: #20232f;
    --line: #2a2e3c;
    --ink: #eceaf2;
    --ink-dim: #8d90a3;
    --ink-faint: #5c5f70;
    --amber: #e8a33d;
    --amber-dim: #7a5a2c;
    --teal: #3e7c6b;
    --teal-bright: #57a58f;
    --danger: #d9705a;
    --sidebar-w: 340px;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow:hidden;
  }
  h1,h2,h3,.brand,.contact-name,.msg-name{ font-family: 'Space Grotesk', 'Inter', sans-serif; }
  button{ font-family:inherit; }
  ::selection{ background: var(--amber-dim); color: #fff; }

  /* ---------- Auth screen ---------- */
  .auth-screen{
    position:fixed; inset:0;
    background: var(--bg);
    display:flex; align-items:center; justify-content:center;
    z-index:100;
    padding:20px;
  }
  .auth-card{
    width: min(360px, 100%);
    background: var(--panel);
    border:1px solid var(--line);
    border-radius:18px;
    padding: 30px 26px;
  }
  .auth-brand{
    display:flex; align-items:center; gap:10px;
    font-size:20px; font-weight:700; margin-bottom:6px;
  }
  .auth-brand .brand-mark{
    width:32px; height:32px; border-radius:10px;
    background: linear-gradient(135deg, var(--amber), #c97f1f);
    display:flex; align-items:center; justify-content:center;
    font-size:16px; font-weight:700; color:#1a1300;
  }
  .auth-sub{ color: var(--ink-dim); font-size:13.5px; margin: 0 0 22px; }
  .auth-field{ margin-bottom:14px; }
  .auth-field label{ display:block; font-size:12.5px; color: var(--ink-dim); margin-bottom:6px; }
  .auth-field input{
    width:100%;
    background: var(--panel-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding: 11px 13px;
    color: var(--ink);
    font-size:14px;
    outline:none;
    font-family:inherit;
  }
  .auth-field input:focus{ border-color: var(--amber-dim); }
  .auth-submit{
    width:100%;
    background: var(--amber);
    color:#221900;
    border:none;
    border-radius:10px;
    padding: 12px;
    font-size:14.5px;
    font-weight:700;
    cursor:pointer;
    margin-top:6px;
  }
  .auth-submit:disabled{ opacity:.5; cursor:default; }
  .auth-switch{
    text-align:center;
    margin-top:16px;
    font-size:13px;
    color: var(--ink-dim);
  }
  .auth-switch button{
    background:none; border:none; color: var(--amber);
    font-weight:600; cursor:pointer; font-size:13px; padding:0;
  }
  .auth-error{
    background: rgba(217,112,90,0.12);
    color: #f0a290;
    border: 1px solid rgba(217,112,90,0.3);
    border-radius: 8px;
    padding: 9px 12px;
    font-size:12.5px;
    margin-bottom:14px;
    display:none;
  }
  .auth-error.show{ display:block; }
  .auth-loading{
    position:fixed; inset:0; background: var(--bg);
    display:flex; align-items:center; justify-content:center;
    color: var(--ink-faint); font-size:13px; z-index:99;
  }

  /* ---------- App shell ---------- */
  .app{
    display:grid;
    grid-template-columns: var(--sidebar-w) 1fr;
    height:100vh; width:100vw;
  }
  .sidebar{
    background: var(--panel);
    border-right: 1px solid var(--line);
    display:flex; flex-direction:column; min-width:0;
  }
  .sidebar-head{
    padding: 22px 20px 14px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .brand{ display:flex; align-items:center; gap:10px; font-size:19px; font-weight:700; letter-spacing:-0.01em; }
  .brand-mark{
    width:30px; height:30px; border-radius:9px;
    background: linear-gradient(135deg, var(--amber), #c97f1f);
    display:flex; align-items:center; justify-content:center;
    font-size:15px; font-weight:700; color:#1a1300; flex-shrink:0;
  }
  .account-switcher{ position:relative; flex-shrink:0; }
  .me-badge{
    width:34px;height:34px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:600;color:#fff;
    border:2px solid var(--panel-2);
    cursor:pointer; flex-shrink:0;
  }
  .account-menu{
    position:absolute; top: calc(100% + 10px); right:0; width:230px;
    background: var(--panel-2); border:1px solid var(--line);
    border-radius:14px; padding:12px;
    box-shadow: 0 12px 28px rgba(0,0,0,.35);
    opacity:0; transform: translateY(-6px); pointer-events:none;
    transition: opacity .14s ease, transform .14s ease; z-index:20;
  }
  .account-menu.open{ opacity:1; transform: translateY(0); pointer-events:auto; }
  .account-menu-name{ font-size:14px; font-weight:600; margin-bottom:2px; }
  .account-menu-email{ font-size:12px; color: var(--ink-faint); margin-bottom:12px; word-break:break-all; }
  .signout-btn{
    width:100%; padding:9px 10px; border-radius:10px;
    background:none; border:1px solid var(--line); color: var(--danger);
    font-size:13px; font-weight:600; cursor:pointer;
  }
  .signout-btn:hover{ background: rgba(217,112,90,0.1); }

  .search-wrap{ padding: 0 16px 14px; }
  .search-box{
    display:flex; align-items:center; gap:8px;
    background: var(--panel-2); border:1px solid var(--line);
    border-radius: 10px; padding: 9px 12px;
  }
  .search-box svg{ flex-shrink:0; opacity:.55; }
  .search-box input{ background:none; border:none; outline:none; color: var(--ink); font-size: 14px; width:100%; }
  .search-box input::placeholder{ color: var(--ink-faint); }

  .filter-row{ display:flex; gap:8px; padding: 0 16px 12px; }
  .filter-chip{
    background:transparent; border:1px solid var(--line); color: var(--ink-dim);
    font-size:12.5px; padding:6px 12px; border-radius:999px; cursor:pointer;
    transition: border-color .15s, color .15s, background .15s;
  }
  .filter-chip.active{ background: var(--amber); border-color: var(--amber); color:#221900; font-weight:600; }

  .thread-list{ flex:1; overflow-y:auto; padding: 2px 8px 12px; }
  .empty-list{ padding: 30px 20px; text-align:center; color: var(--ink-faint); font-size:13px; }
  .thread-item{
    display:flex; align-items:center; gap:12px; padding: 10px 10px;
    border-radius: 12px; cursor:pointer; position:relative; transition: background .12s;
  }
  .thread-item:hover{ background: rgba(255,255,255,0.03); }
  .thread-item.active{ background: var(--panel-2); }
  .thread-item.active::before{
    content:''; position:absolute; left:-8px; top:14px; bottom:14px; width:3px;
    background: var(--amber); border-radius: 2px;
  }
  .avatar{
    width:44px; height:44px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-weight:600; font-size:14.5px; color:#fff; flex-shrink:0; position:relative;
  }
  .dot{ position:absolute; right:-1px; bottom:-1px; width:11px; height:11px; border-radius:50%; border: 2.5px solid var(--panel); }
  .thread-item.active .dot{ border-color: var(--panel-2); }
  .dot.online{ background:#4fd17a; }
  .dot.away{ background: var(--amber); }
  .dot.offline{ background: var(--ink-faint); }

  .thread-mid{ flex:1; min-width:0; }
  .thread-top{ display:flex; justify-content:space-between; align-items:baseline; gap:6px; }
  .contact-name{ font-size:14.5px; font-weight:600; color: var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .thread-time{ font-size:11px; color: var(--ink-faint); flex-shrink:0; }
  .thread-preview{ font-size:13px; color: var(--ink-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
  .unread-dot{ width:9px; height:9px; border-radius:50%; background: var(--amber); flex-shrink:0; }

  .chat{ display:flex; flex-direction:column; min-width:0; background: var(--bg); position:relative; }
  .chat-head{ display:flex; align-items:center; gap:12px; padding: 14px 22px; border-bottom: 1px solid var(--line); flex-shrink:0; }
  .back-btn{ display:none; background:none; border:none; color: var(--ink); cursor:pointer; padding:4px; margin-right:2px; align-items:center; justify-content:center; }
  .chat-head .avatar{ width:38px; height:38px; font-size:13px; }
  .chat-head-info{ flex:1; min-width:0; }
  .chat-head-name{ font-size:15px; font-weight:600; }
  .chat-head-status{ font-size:12px; color: var(--ink-dim); margin-top:1px; }
  .chat-head-status.online{ color: var(--teal-bright); }

  .messages{ flex:1; overflow-y:auto; padding: 22px 26px; display:flex; flex-direction:column; gap:3px; }
  .day-sep{ text-align:center; color: var(--ink-faint); font-size:11.5px; margin: 14px 0 18px; text-transform:uppercase; letter-spacing:.06em; }
  .row{ display:flex; margin-bottom: 4px; max-width:100%; }
  .row.me{ justify-content:flex-end; }
  .bubble{ max-width: min(66%, 480px); padding: 10px 14px; border-radius: 16px; font-size: 14.5px; line-height:1.42; word-wrap:break-word; }
  .row.them .bubble{ background: var(--panel-2); color: var(--ink); border-bottom-left-radius: 4px; }
  .row.me .bubble{ background: var(--teal); color: #eafff7; border-bottom-right-radius: 4px; }
  .msg-meta{ font-size:10.5px; color: var(--ink-faint); margin: 3px 4px 10px; }

  .composer{ display:flex; align-items:flex-end; gap:10px; padding: 14px 20px; border-top: 1px solid var(--line); flex-shrink:0; background: var(--bg); }
  .composer-input{
    flex:1; background: var(--panel-2); border: 1px solid var(--line); border-radius: 20px;
    padding: 10px 16px; color: var(--ink); font-size: 14.5px; max-height: 120px; resize:none;
    outline:none; font-family:inherit; line-height:1.4;
  }
  .composer-input:focus{ border-color: var(--amber-dim); }
  .composer-input::placeholder{ color: var(--ink-faint); }
  .send-btn{
    width:40px; height:40px; flex-shrink:0; border-radius:50%; background: var(--amber);
    border:none; color:#221900; display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition: transform .1s, opacity .15s;
  }
  .send-btn:disabled{ opacity:.4; cursor:default; }
  .send-btn:not(:disabled):active{ transform: scale(.92); }

  .empty-state{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; color: var(--ink-faint); gap:10px; text-align:center; padding:40px; }
  .empty-state .brand-mark{ width:52px;height:52px;border-radius:16px;font-size:24px;margin-bottom:6px; }
  .empty-state h2{ color: var(--ink-dim); font-size:16px; font-weight:600; margin:0; }
  .empty-state p{ margin:0; font-size:13px; max-width:260px; }

  .thread-list::-webkit-scrollbar, .messages::-webkit-scrollbar{ width:8px; }
  .thread-list::-webkit-scrollbar-thumb, .messages::-webkit-scrollbar-thumb{ background: var(--line); border-radius: 8px; }

  @media (max-width: 760px){
    .app{ grid-template-columns: 1fr; position:relative; }
    .sidebar{ position:absolute; inset:0; z-index:2; transition: transform .28s ease; width:100%; }
    .chat{ position:absolute; inset:0; z-index:1; transform: translateX(100%); transition: transform .28s ease; }
    .app.chat-open .sidebar{ transform: translateX(-100%); }
    .app.chat-open .chat{ transform: translateX(0); }
    .back-btn{ display:flex; }
    .bubble{ max-width: 78%; }
    .empty-state{ display:none; }
  }
  @media (min-width: 761px){
    .app:not(.has-selection) .chat{ display:none; }
    .app.has-selection .empty-state{ display:none; }
  }
  @media (prefers-reduced-motion: reduce){ .sidebar, .chat{ transition:none !important; } }
</style>
</head>
<body>

<div class="auth-loading" id="authLoading">Loading…</div>

<div class="auth-screen" id="authScreen" style="display:none;">
  <div class="auth-card">
    <div class="auth-brand"><div class="brand-mark">T</div>Thread</div>
    <p class="auth-sub" id="authSub">Sign in to message real people.</p>
    <div class="auth-error" id="authError"></div>
    <div class="auth-field" id="nameField" style="display:none;">
      <label>Your name</label>
      <input type="text" id="authName" placeholder="e.g. Sam Rivera">
    </div>
    <div class="auth-field">
      <label>Email</label>
      <input type="email" id="authEmail" placeholder="you@example.com">
    </div>
    <div class="auth-field">
      <label>Password</label>
      <input type="password" id="authPassword" placeholder="At least 6 characters">
    </div>
    <button class="auth-submit" id="authSubmit">Sign in</button>
    <div class="auth-switch">
      <span id="authSwitchText">Don't have an account?</span>
      <button id="authSwitchBtn">Sign up</button>
    </div>
  </div>
</div>

<div class="app" id="app" style="display:none;">
  <aside class="sidebar">
    <div class="sidebar-head">
      <div class="brand"><div class="brand-mark">T</div>Thread</div>
      <div class="account-switcher" id="accountSwitcher">
        <button class="me-badge" id="meBadge" title="Account"></button>
        <div class="account-menu" id="accountMenu">
          <div class="account-menu-name" id="menuName"></div>
          <div class="account-menu-email" id="menuEmail"></div>
          <button class="signout-btn" id="signOutBtn">Sign out</button>
        </div>
      </div>
    </div>
    <div class="search-wrap">
      <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" type="text" placeholder="Search people">
      </div>
    </div>
    <div class="filter-row" id="filterRow">
      <button class="filter-chip active" data-filter="all">All</button>
      <button class="filter-chip" data-filter="online">Active now</button>
    </div>
    <div class="thread-list" id="threadList"></div>
  </aside>

  <main class="chat" id="chatPane">
    <div class="empty-state" id="emptyState">
      <div class="brand-mark">T</div>
      <h2>Pick someone to message</h2>
      <p>Everyone who has signed up shows up on the left. Select a name to start a real conversation.</p>
    </div>

    <div id="chatContent" style="display:none; flex-direction:column; height:100%;">
      <div class="chat-head">
        <button class="back-btn" id="backBtn" aria-label="Back to conversations">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="avatar" id="headAvatar"></div>
        <div class="chat-head-info">
          <div class="chat-head-name" id="headName"></div>
          <div class="chat-head-status" id="headStatus"></div>
        </div>
      </div>

      <div class="messages" id="messages"></div>

      <div class="composer">
        <textarea class="composer-input" id="composerInput" placeholder="Write a message" rows="1"></textarea>
        <button class="send-btn" id="sendBtn" disabled aria-label="Send message">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
  </main>
</div>

<script>
(function(){
  "use strict";

  // ============================================================
  // 1. PASTE YOUR FIREBASE CONFIG HERE (from Firebase Console →
  //    Project settings → General → Your apps → SDK setup)
  // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyC0GWZkak35-3880hacoiWrhapbnRGW5-U",
    authDomain: "chating-3b366.firebaseapp.com",
    projectId: "chating-3b366",
    storageBucket: "chating-3b366.firebasestorage.app",
    messagingSenderId: "474440431733",
    appId: "1:474440431733:web:a98d72e7fcb7c8f1ce603c",
    measurementId: "G-83CDNK8W4E"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
  const FieldValue = firebase.firestore.FieldValue;

  // ---------- Helpers ----------
  const palette = ['#e8a33d','#3e7c6b','#5a7fd6','#c9578a','#5aa8a0','#c97f1f','#7d6fd1'];
  function colorFromString(str){
    let h = 0;
    for(let i=0;i<str.length;i++){ h = str.charCodeAt(i) + ((h<<5)-h); }
    return palette[Math.abs(h) % palette.length];
  }
  function initials(name){
    return (name||'?').trim().split(' ').map(p=>p[0]).slice(0,2).join('').toUpperCase();
  }
  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s == null ? '' : s;
    return d.innerHTML;
  }
  function fmtTime(ms){
    if(!ms) return '';
    const d = new Date(ms);
    let h = d.getHours(), m = d.getMinutes();
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if(h===0) h = 12;
    return `${h}:${String(m).padStart(2,'0')} ${ampm}`;
  }
  function fmtListTime(ms){
    if(!ms) return '';
    const diff = Date.now() - ms;
    const min = 60000, hr = 60*min;
    if(diff < min) return 'now';
    if(diff < hr) return Math.round(diff/min) + 'm';
    if(diff < 24*hr) return Math.round(diff/hr) + 'h';
    return Math.round(diff/(24*hr)) + 'd';
  }
  function chatIdFor(a, b){ return [a,b].sort().join('_'); }

  // ---------- DOM ----------
  const authLoading = document.getElementById('authLoading');
  const authScreen = document.getElementById('authScreen');
  const authSub = document.getElementById('authSub');
  const authError = document.getElementById('authError');
  const nameField = document.getElementById('nameField');
  const authName = document.getElementById('authName');
  const authEmail = document.getElementById('authEmail');
  const authPassword = document.getElementById('authPassword');
  const authSubmit = document.getElementById('authSubmit');
  const authSwitchText = document.getElementById('authSwitchText');
  const authSwitchBtn = document.getElementById('authSwitchBtn');

  const app = document.getElementById('app');
  const threadListEl = document.getElementById('threadList');
  const searchInput = document.getElementById('searchInput');
  const filterRow = document.getElementById('filterRow');
  const emptyState = document.getElementById('emptyState');
  const chatContent = document.getElementById('chatContent');
  const messagesEl = document.getElementById('messages');
  const headAvatar = document.getElementById('headAvatar');
  const headName = document.getElementById('headName');
  const headStatus = document.getElementById('headStatus');
  const composerInput = document.getElementById('composerInput');
  const sendBtn = document.getElementById('sendBtn');
  const backBtn = document.getElementById('backBtn');
  const meBadge = document.getElementById('meBadge');
  const accountMenu = document.getElementById('accountMenu');
  const menuName = document.getElementById('menuName');
  const menuEmail = document.getElementById('menuEmail');
  const signOutBtn = document.getElementById('signOutBtn');

  // ---------- Auth screen mode ----------
  let mode = 'signin';
  function setMode(m){
    mode = m;
    authError.classList.remove('show');
    if(m === 'signin'){
      authSub.textContent = 'Sign in to message real people.';
      nameField.style.display = 'none';
      authSubmit.textContent = 'Sign in';
      authSwitchText.textContent = "Don't have an account?";
      authSwitchBtn.textContent = 'Sign up';
    } else {
      authSub.textContent = 'Create an account to start chatting.';
      nameField.style.display = 'block';
      authSubmit.textContent = 'Sign up';
      authSwitchText.textContent = 'Already have an account?';
      authSwitchBtn.textContent = 'Sign in';
    }
  }
  authSwitchBtn.addEventListener('click', () => setMode(mode === 'signin' ? 'signup' : 'signin'));

  function showAuthError(msg){
    authError.textContent = msg;
    authError.classList.add('show');
  }

  authSubmit.addEventListener('click', () => {
    const email = authEmail.value.trim();
    const pass = authPassword.value;
    const name = authName.value.trim();
    if(!email || !pass){ showAuthError('Enter an email and password.'); return; }
    if(mode === 'signup' && !name){ showAuthError('Enter your name.'); return; }
    authSubmit.disabled = true;
    authError.classList.remove('show');

    if(mode === 'signup'){
      auth.createUserWithEmailAndPassword(email, pass)
        .then(cred => {
          return cred.user.updateProfile({displayName: name}).then(() => {
            return db.collection('users').doc(cred.user.uid).set({
              name: name,
              email: email,
              createdAt: FieldValue.serverTimestamp(),
              lastActive: FieldValue.serverTimestamp()
            });
          });
        })
        .catch(err => { showAuthError(err.message); authSubmit.disabled = false; });
    } else {
      auth.signInWithEmailAndPassword(email, pass)
        .catch(err => { showAuthError(err.message); authSubmit.disabled = false; });
    }
  });

  signOutBtn.addEventListener('click', () => auth.signOut());

  // ---------- App state ----------
  let myUid = null;
  let myProfile = null;
  let users = {};            // uid -> {id, name, email, lastActive(ms)}
  let lastMessages = {};     // uid -> {text, senderId, atMs}
  let unsubMessageStubs = {};
  let currentChatUid = null;
  let currentChatUnsub = null;
  let filter = 'all';
  let query = '';
  let usersUnsub = null;
  let statusTicker = null;

  // Safety net: if auth never resolves (e.g. a network/config issue),
  // stop showing a blank "Loading…" forever and explain what's wrong.
  setTimeout(() => {
    if(authLoading.style.display !== 'none'){
      authLoading.textContent = "Couldn't connect. Check your internet connection, or that the Firebase config and Firestore/Authentication setup are correct, then reload.";
      authLoading.style.padding = '30px';
      authLoading.style.textAlign = 'center';
    }
  }, 6000);

  function isOnline(lastActiveMs){ return lastActiveMs && (Date.now() - lastActiveMs) < 60000; }
  function isAway(lastActiveMs){ return lastActiveMs && (Date.now() - lastActiveMs) < 5*60000; }
  function statusOf(uid){
    const la = users[uid] && users[uid].lastActive;
    if(isOnline(la)) return 'online';
    if(isAway(la)) return 'away';
    return 'offline';
  }
  function statusLabel(s){ return s === 'online' ? 'Active now' : s === 'away' ? 'Away' : 'Offline'; }

  auth.onAuthStateChanged(user => {
    authLoading.style.display = 'none';
    if(user){
      myUid = user.uid;
      authScreen.style.display = 'none';
      app.style.display = 'grid';
      startApp(user);
    } else {
      myUid = null;
      stopApp();
      app.style.display = 'none';
      authScreen.style.display = 'flex';
      authSubmit.disabled = false;
      setMode('signin');
    }
  });

  function stopApp(){
    if(usersUnsub) usersUnsub();
    if(currentChatUnsub) currentChatUnsub();
    Object.values(unsubMessageStubs).forEach(fn => fn());
    unsubMessageStubs = {};
    if(statusTicker) clearInterval(statusTicker);
    users = {}; lastMessages = {}; currentChatUid = null;
  }

  function startApp(user){
    myProfile = { name: user.displayName || user.email, email: user.email };
    meBadge.textContent = initials(myProfile.name);
    meBadge.style.background = colorFromString(user.uid);
    menuName.textContent = myProfile.name;
    menuEmail.textContent = myProfile.email;

    // Presence: mark active now, then every 25s while open
    touchPresence();
    statusTicker = setInterval(() => { touchPresence(); renderList(); if(currentChatUid) renderHeadStatus(); }, 25000);
    document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') touchPresence(); });

    // Live list of everyone
    usersUnsub = db.collection('users').onSnapshot(snap => {
      snap.docChanges().forEach(change => {
        const uid = change.doc.id;
        if(change.type === 'removed'){
          delete users[uid];
          if(unsubMessageStubs[uid]){ unsubMessageStubs[uid](); delete unsubMessageStubs[uid]; }
          return;
        }
        const d = change.doc.data();
        users[uid] = {
          id: uid,
          name: d.name || d.email || 'Someone',
          email: d.email || '',
          lastActive: d.lastActive && d.lastActive.toMillis ? d.lastActive.toMillis() : null
        };
        if(uid !== myUid && !unsubMessageStubs[uid]){
          watchPreview(uid);
        }
      });
      renderList();
    }, err => console.error('users snapshot error', err));
  }

  function touchPresence(){
    if(!myUid) return;
    db.collection('users').doc(myUid).set({ lastActive: FieldValue.serverTimestamp() }, {merge:true})
      .catch(err => console.error('presence update failed', err));
  }

  function watchPreview(uid){
    const chatId = chatIdFor(myUid, uid);
    const unsub = db.collection('chats').doc(chatId).collection('messages')
      .orderBy('createdAt','desc').limit(1)
      .onSnapshot(snap => {
        if(!snap.empty){
          const doc = snap.docs[0];
          const d = doc.data();
          lastMessages[uid] = {
            text: d.text,
            senderId: d.senderId,
            atMs: d.createdAt && d.createdAt.toMillis ? d.createdAt.toMillis() : Date.now()
          };
        } else {
          lastMessages[uid] = null;
        }
        renderList();
      }, err => console.error('preview snapshot error', err));
    unsubMessageStubs[uid] = unsub;
  }

  function lastReadKey(uid){ return 'thread_lastread_' + myUid + '_' + uid; }
  function getLastRead(uid){
    try { return parseInt(localStorage.getItem(lastReadKey(uid)) || '0', 10); }
    catch(e){ return 0; }
  }
  function setLastRead(uid){
    try { localStorage.setItem(lastReadKey(uid), String(Date.now())); }
    catch(e){}
  }

  // ---------- Render list ----------
  function renderList(){
    const q = query.trim().toLowerCase();
    const others = Object.values(users).filter(u => u.id !== myUid);

    threadListEl.innerHTML = '';
    const filtered = others.filter(u => {
      if(filter === 'online' && statusOf(u.id) !== 'online') return false;
      if(q && !u.name.toLowerCase().includes(q)) return false;
      return true;
    }).sort((a,b) => {
      const at = (lastMessages[a.id] && lastMessages[a.id].atMs) || 0;
      const bt = (lastMessages[b.id] && lastMessages[b.id].atMs) || 0;
      if(at !== bt) return bt - at;
      return a.name.localeCompare(b.name);
    });

    if(others.length === 0){
      threadListEl.innerHTML = '<div class="empty-list">No one else has signed up yet. Share this app so others can join and you can message them here.</div>';
      return;
    }
    if(filtered.length === 0){
      threadListEl.innerHTML = '<div class="empty-list">No matches.</div>';
      return;
    }

    filtered.forEach(u => {
      const last = lastMessages[u.id];
      const unread = last && last.senderId !== myUid && last.atMs > getLastRead(u.id);
      const item = document.createElement('div');
      item.className = 'thread-item' + (u.id === currentChatUid ? ' active' : '');
      item.innerHTML = `
        <div class="avatar" style="background:${colorFromString(u.id)}">
          ${initials(u.name)}
          <span class="dot ${statusOf(u.id)}"></span>
        </div>
        <div class="thread-mid">
          <div class="thread-top">
            <span class="contact-name">${escapeHtml(u.name)}</span>
            <span class="thread-time">${last ? fmtListTime(last.atMs) : ''}</span>
          </div>
          <div class="thread-preview">${last ? (last.senderId===myUid ? 'You: ' : '') + escapeHtml(last.text) : 'Say hello'}</div>
        </div>
        ${unread ? '<div class="unread-dot"></div>' : ''}
      `;
      item.addEventListener('click', () => openChat(u.id));
      threadListEl.appendChild(item);
    });
  }

  // ---------- Open chat ----------
  function openChat(uid){
    currentChatUid = uid;
    setLastRead(uid);
    const u = users[uid];
    emptyState.style.display = 'none';
    chatContent.style.display = 'flex';
    app.classList.add('has-selection');
    app.classList.add('chat-open');

    headAvatar.style.background = colorFromString(uid);
    headAvatar.textContent = initials(u.name);
    headName.textContent = u.name;
    renderHeadStatus();
    renderList();

    if(currentChatUnsub) currentChatUnsub();
    const chatId = chatIdFor(myUid, uid);
    currentChatUnsub = db.collection('chats').doc(chatId).collection('messages')
      .orderBy('createdAt','asc')
      .onSnapshot(snap => {
        const msgs = snap.docs.map(doc => {
          const d = doc.data();
          return {
            who: d.senderId === myUid ? 'me' : 'them',
            text: d.text,
            t: d.createdAt && d.createdAt.toMillis ? d.createdAt.toMillis() : Date.now()
          };
        });
        renderMessages(msgs);
        setLastRead(uid);
        renderList();
      }, err => console.error('messages snapshot error', err));

    composerInput.focus();
  }

  function renderHeadStatus(){
    if(!currentChatUid) return;
    const s = statusOf(currentChatUid);
    headStatus.textContent = statusLabel(s);
    headStatus.className = 'chat-head-status' + (s === 'online' ? ' online' : '');
  }

  function renderMessages(msgs){
    messagesEl.innerHTML = '';
    let lastDay = null;
    msgs.forEach((m, i) => {
      const day = new Date(m.t).toDateString();
      if(day !== lastDay){
        const sep = document.createElement('div');
        sep.className = 'day-sep';
        const isToday = day === new Date().toDateString();
        sep.textContent = isToday ? 'Today' : new Date(m.t).toLocaleDateString(undefined,{month:'short', day:'numeric'});
        messagesEl.appendChild(sep);
        lastDay = day;
      }
      const row = document.createElement('div');
      row.className = 'row ' + m.who;
      row.innerHTML = `<div class="bubble">${escapeHtml(m.text)}</div>`;
      messagesEl.appendChild(row);

      const isLastInGroup = (i === msgs.length-1) || msgs[i+1].who !== m.who;
      if(isLastInGroup){
        const meta = document.createElement('div');
        meta.className = 'msg-meta';
        meta.style.textAlign = m.who === 'me' ? 'right' : 'left';
        meta.textContent = fmtTime(m.t);
        messagesEl.appendChild(meta);
      }
    });
    if(msgs.length === 0){
      messagesEl.innerHTML = '<div class="empty-list">No messages yet — say hi.</div>';
    }
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  // ---------- Sending ----------
  function sendMessage(){
    const val = composerInput.value.trim();
    if(!val || !currentChatUid) return;
    const chatId = chatIdFor(myUid, currentChatUid);
    composerInput.value = '';
    autoGrow();
    updateSendState();
    db.collection('chats').doc(chatId).collection('messages').add({
      senderId: myUid,
      text: val,
      createdAt: FieldValue.serverTimestamp()
    }).catch(err => console.error('send failed', err));
  }

  function autoGrow(){
    composerInput.style.height = 'auto';
    composerInput.style.height = Math.min(composerInput.scrollHeight, 120) + 'px';
  }
  function updateSendState(){ sendBtn.disabled = composerInput.value.trim().length === 0; }

  composerInput.addEventListener('input', () => { autoGrow(); updateSendState(); });
  composerInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
  });
  sendBtn.addEventListener('click', sendMessage);

  // ---------- Controls ----------
  backBtn.addEventListener('click', () => app.classList.remove('chat-open'));

  filterRow.addEventListener('click', (e) => {
    const btn = e.target.closest('.filter-chip');
    if(!btn) return;
    [...filterRow.children].forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    filter = btn.dataset.filter;
    renderList();
  });

  searchInput.addEventListener('input', (e) => { query = e.target.value; renderList(); });

  meBadge.addEventListener('click', (e) => {
    e.stopPropagation();
    accountMenu.classList.toggle('open');
  });
  document.addEventListener('click', (e) => {
    if(!accountMenu.contains(e.target) && e.target !== meBadge) accountMenu.classList.remove('open');
  });

})();
</script>
</body>
</html>
